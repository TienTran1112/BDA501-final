# Docker Desktop gives containers 7.6 GB here, so the driver gets 5 GB and the rest is left for
# Python workers and the OS. Change these and restart a job; no image rebuild is needed.
spark.master                          local[*]
spark.driver.memory                   5g
spark.sql.shuffle.partitions          48
spark.sql.session.timeZone            UTC
spark.sql.parquet.compression.codec   zstd
spark.ui.showConsoleProgress          false
